const Utils = (() => {
  const q=(s,p=document)=>p.querySelector(s), qa=(s,p=document)=>[...p.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const id=(prefix='ID')=>`${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
  const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const toDateKey=v=>{
    if(v===null||v===undefined||v==='')return '';
    if(v instanceof Date)return isNaN(v)?'':dateKey(v);
    if(typeof v==='number'&&Number.isFinite(v)){
      if(v>1e11){const d=new Date(v);return isNaN(d)?'':dateKey(d)}
      if(v>1e9){const d=new Date(v*1000);return isNaN(d)?'':dateKey(d)}
      if(v>20000&&v<100000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
    }
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d=new Date(s);return isNaN(d)?'':dateKey(d)
  };
  const sameDate=(v,key)=>toDateKey(v)===toDateKey(key);
  const today=()=>dateKey();
  const isoNow=()=>new Date().toISOString();
  const formatDate=(v,opt={day:'2-digit',month:'short',year:'numeric'})=>{const k=toDateKey(v);if(!k)return v?String(v):'-';const d=new Date(k+'T00:00:00');return d.toLocaleDateString('id-ID',opt)};
  const formatDateTime=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})};
  const num=v=>new Intl.NumberFormat('id-ID').format(Number(v)||0);
  const parseJSON=(v,fallback=[])=>{if(Array.isArray(v)||typeof v==='object'&&v!==null)return v;let cur=v;for(let i=0;i<3&&typeof cur==='string';i++){const text=cur.trim();if(!text)return fallback;try{cur=JSON.parse(text)}catch{return fallback}}return Array.isArray(cur)||typeof cur==='object'&&cur!==null?cur:fallback};
  const initials=n=>String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const debounce=(fn,wait=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}};
  const idle=(fn,timeout=120)=>{if('requestIdleCallback' in window)return requestIdleCallback(()=>fn(),{timeout});return setTimeout(fn,0)};
  const toast=(msg,type='')=>{const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;q('#toastRoot').appendChild(el);setTimeout(()=>el.remove(),3200)};
  const statusBadge=s=>{const c=/publish|selesai|approved|insight/i.test(s)?'green':/review|planning|proses/i.test(s)?'blue':/revisi|urgent/i.test(s)?'red':/produksi/i.test(s)?'orange':'gray';return `<span class="badge badge-${c}">${esc(s||'-')}</span>`};
  const download=(name,content,type='text/plain;charset=utf-8')=>{const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)};
  const copy=async text=>{try{await navigator.clipboard.writeText(text);toast('Berhasil disalin','success')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Berhasil disalin','success')}};
  const modal=(title,body,foot='',size='')=>{q('#modalRoot').innerHTML=`<div class="modal-overlay"><div class="modal ${size}"><div class="modal-head"><h3>${esc(title)}</h3><button class="close-btn" data-close-modal>✕</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;qa('[data-close-modal]').forEach(x=>x.onclick=closeModal);q('.modal-overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal()})};
  const closeModal=()=>q('#modalRoot').innerHTML='';
  const printDocument=(title,html)=>{const w=window.open('','_blank','width=900,height=800');if(!w){toast('Pop-up diblokir browser','error');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111827;margin:0}.page{padding:38px 48px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #be185d;padding-bottom:14px}.logo{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid #e5e7eb}.logo img{width:100%;height:100%;object-fit:contain}.org{font-size:12px;color:#64748b}.title{font-size:24px;margin:24px 0 5px}.date{font-size:12px;color:#64748b;margin-bottom:24px}.section{margin:18px 0}.section h3{font-size:13px;text-transform:uppercase;color:#be185d;border-bottom:1px solid #e5e7eb;padding-bottom:6px}.section p,.section li,.section td{font-size:12px;line-height:1.65}.section table{width:100%;border-collapse:collapse}.section th,.section td{border:1px solid #e5e7eb;padding:8px;text-align:left}.footer{margin-top:40px;border-top:1px solid #e5e7eb;padding-top:10px;font-size:10px;color:#f9a8d4;text-align:center}@media print{@page{size:A4;margin:0}.no-print{display:none}}</style></head><body><div class="page"><div class="header"><div><strong>${esc(Config.data.organization)}</strong><div class="org">Content Management System</div></div><div class="logo"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div></div>${html}<div class="footer">Dokumen dibuat melalui ${esc(Config.data.appName)} • ${new Date().toLocaleString('id-ID')}</div></div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()};
  const xmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const exportXls=(name,sheets)=>{let worksheets='';Object.entries(sheets).forEach(([sheetName,rows])=>{worksheets+=`<Worksheet ss:Name="${xmlEsc(sheetName.slice(0,31))}"><Table>`+rows.map(r=>'<Row>'+r.map(c=>`<Cell><Data ss:Type="${typeof c==='number'?'Number':'String'}">${xmlEsc(c)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet>'});const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${worksheets}</Workbook>`;download(name,xml,'application/vnd.ms-excel')};
  const formData=form=>Object.fromEntries(new FormData(form).entries());
  const beginSubmit=(button,message='Apakah data sudah benar dan siap disimpan? Klik OK satu kali saja untuk mencegah data ganda.',busyText='Menyimpan...')=>{
    if(!button)return null;
    if(button.dataset.submitting==='1'){toast('Data sedang diproses. Mohon tunggu hingga selesai.','error');return null}
    if(!window.confirm(message))return null;
    const original=button.innerHTML;
    button.dataset.submitting='1';button.disabled=true;button.innerHTML=`⏳ ${esc(busyText)}`;
    return ()=>{if(button.isConnected){button.disabled=false;button.innerHTML=original;delete button.dataset.submitting}}
  };
  return {q,qa,esc,id,today,dateKey,toDateKey,sameDate,isoNow,formatDate,formatDateTime,num,parseJSON,initials,debounce,idle,toast,statusBadge,download,copy,modal,closeModal,printDocument,exportXls,formData,beginSubmit};
})();

/* ================================================================
   AUTH MODULE
================================================================ */
const Auth = (() => {
  const KEY='govcms_session_v1';
  let session=null;try{session=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{}
  const set=s=>{session=s;Auth.session=s;sessionStorage.setItem(KEY,JSON.stringify(s));setTimeout(()=>{if(typeof OfflineQueue!=='undefined'){OfflineQueue.render();OfflineQueue.process()}},0)};
  const login=async(username,password)=>{
    if(typeof Store!=='undefined')Store.resetSession?.();
    const cached=!API.isDemo()?await ClientCache.getForLogin(username):null;
    const out=await API.call('loginTurbo',{username,password,has_cache:!!cached,revision:cached?.data?.revision||''});
    const s=out?.session||out;set(s);
    await ClientCache.rememberLogin?.(username,s.user);
    if(cached?.data&&typeof Store!=='undefined'){
      Store.cacheHydrated=true;
      Store.apply(cached,true);
    }
    if(out?.data&&typeof Store!=='undefined'){
      Store.apply(out.data,false);
      await Store.persistCache?.();
    }else if(cached?.data&&typeof Store!=='undefined'){
      setTimeout(()=>Store.load().then(()=>{if(location.hash&&location.hash!=='#public')App.navigate(location.hash.slice(1)||'dashboard',false)}).catch(()=>{}),60);
    }else if(typeof Store!=='undefined'){
      await Store.load({force:true});
    }
    return s
  };
  const logout=()=>{sessionStorage.removeItem(KEY);session=null;Auth.session=null;Store.resetSession?.();location.hash='';if(typeof OfflineQueue!=='undefined')OfflineQueue.render();App.renderLogin()};
  const can=(...roles)=>!!session&&roles.includes(session.user.role);
  return {session,login,logout,can,set};
})();

/* ================================================================
   CLIENT CACHE MODULE (IndexedDB + localStorage fallback)
================================================================ */
const ClientCache = (() => {
  const DB_NAME='media_wg_client_cache_v150', STORE_NAME='snapshots', FALLBACK_PREFIX='mwg_snapshot_v150_', ALIAS_PREFIX='mwg_login_alias_v177_';
  let dbPromise=null;
  const userKey=user=>`${Config.data.apiUrl}|${user?.id||user?.username||user?.nama||'guest'}`;
  const cacheKey=()=>userKey(Auth.session?.user||{});
  const localKey=key=>FALLBACK_PREFIX+btoa(unescape(encodeURIComponent(key))).slice(0,80);
  const aliasKey=username=>ALIAS_PREFIX+btoa(unescape(encodeURIComponent(`${Config.data.apiUrl}|${String(username||'').trim().toLowerCase()}`))).slice(0,100);
  function openDb(){
    if(!('indexedDB' in window))return Promise.resolve(null);
    if(dbPromise)return dbPromise;
    dbPromise=new Promise(resolve=>{
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME)};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    });
    return dbPromise;
  }
  async function readKey(key){
    const db=await openDb();
    if(db){const value=await new Promise(resolve=>{try{const tx=db.transaction(STORE_NAME,'readonly'),r=tx.objectStore(STORE_NAME).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch{resolve(null)}});if(value)return value}
    try{return JSON.parse(localStorage.getItem(localKey(key))||'null')}catch{return null}
  }
  async function writeKey(key,value){
    const db=await openDb();
    if(db){try{await new Promise(resolve=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()});return true}catch{}}
    try{localStorage.setItem(localKey(key),JSON.stringify(value));return true}catch{return false}
  }
  async function deleteKey(key){
    const db=await openDb();
    if(db){try{await new Promise(resolve=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve()})}catch{}}
    try{localStorage.removeItem(localKey(key))}catch{}
  }
  async function get(){return readKey(cacheKey())}
  async function set(value){return writeKey(cacheKey(),value)}
  async function remove(){return deleteKey(cacheKey())}
  async function rememberLogin(username,user){try{localStorage.setItem(aliasKey(username),String(user?.id||user?.username||user?.nama||''));return true}catch{return false}}
  async function getForLogin(username){
    let identity='';try{identity=localStorage.getItem(aliasKey(username))||''}catch{}
    if(!identity)return null;
    const cached=await readKey(`${Config.data.apiUrl}|${identity}`);
    if(!cached?.data)return null;
    if(cached.version&&cached.version.split('.')[0]!==APP_VERSION.split('.')[0])return null;
    return cached
  }
  return {get,set,remove,getForLogin,rememberLogin};
})();

/* ================================================================
   STORE MODULE
================================================================ */
const Store={briefs:[],tasks:[],myBriefs:null,myTasks:null,hotIssues:[],meetings:[],accounts:[],templates:[],htmlDocuments:[],footages:[],footageMeta:null,systemSettings:{},notifications:[],activity:[],versions:[],systemStatus:null,apiInfo:null,performance:null,revision:'',loaded:false,cacheHydrated:false,fromCache:false,lastSyncAt:'',lastFullSyncAt:'',loadingPromise:null,lazyLoaded:{htmlDocuments:false,activity:false,versions:false,systemStatus:false},lazyPromises:{},_briefMap:new Map(),_taskMap:new Map(),_tasksByBrief:new Map(),_accountMap:new Map(),_hotIssueMap:new Map(),
  cleanPersonNames(value){
    const out=[];
    const walk=v=>{
      if(Array.isArray(v)){v.forEach(walk);return}
      if(v&&typeof v==='object'){walk(v.nama??v.petugas??'');return}
      let s=String(v??'').trim();if(!s)return;
      for(let i=0;i<3;i++){
        if(!/^(?:["'\[{])/.test(s))break;
        try{const parsed=JSON.parse(s);if(parsed===s)break;walk(parsed);return}catch{break}
      }
      s=s.replace(/^["']+|["']+$/g,'').trim();
      if(!s||/^(?:\[\]|\{\}|null|undefined)$/i.test(s))return;
      out.push(s)
    };
    walk(value);return out
  },
  snapshot(){
    const keys=['briefs','tasks','myBriefs','myTasks','hotIssues','meetings','accounts','templates','systemSettings','notifications','apiInfo','performance','revision','lastFullSyncAt'];

  apply(data,fromCache=false){
    if(!data)return false;
    Object.assign(this,data.data||data);
    this.rebuildIndexes();
    this.loaded=true;this.fromCache=fromCache;this.lastSyncAt=data.performance?.generated_at||new Date().toISOString();if(!fromCache)this.lastFullSyncAt=this.lastSyncAt;
    return true
  },
  rebuildIndexes(){
    this._briefMap=new Map((this.briefs||[]).map(x=>[String(x.id),x]));
    this._taskMap=new Map((this.tasks||[]).map(x=>[String(x.id),x]));
    this._accountMap=new Map((this.accounts||[]).map(x=>[String(x.id),x]));
    this._hotIssueMap=new Map((this.hotIssues||[]).map(x=>[String(x.id),x]));
    this._tasksByBrief=new Map();
    (this.tasks||[]).forEach(t=>{const key=String(t.brief_id||'');if(!key)return;const rows=this._tasksByBrief.get(key)||[];rows.push(t);this._tasksByBrief.set(key,rows)});
  },
  briefById(id){return this._briefMap.get(String(id))||null},
  taskById(id){return this._taskMap.get(String(id))||null},
  tasksForBrief(id){return this._tasksByBrief.get(String(id))||[]},
  hotIssueById(id){return this._hotIssueMap.get(String(id))||null},
  async hydrateCache(){
    if(this.cacheHydrated||!Auth.session||API.isDemo())return false;
    this.cacheHydrated=true;
    const cached=await ClientCache.get();
    if(!cached||!cached.data)return false;
    if(cached.version&&cached.version.split('.')[0]!==APP_VERSION.split('.')[0])return false;
    return this.apply(cached,true)
  },
  async persistCache(){if(!Auth.session||API.isDemo())return;await ClientCache.set(this.snapshot())},
  async clearCache(){this.cacheHydrated=false;await ClientCache.remove()},
  resetSession(){
    Object.assign(this,{briefs:[],tasks:[],myBriefs:null,myTasks:null,hotIssues:[],meetings:[],accounts:[],templates:[],htmlDocuments:[],footages:[],footageMeta:null,systemSettings:{},notifications:[],activity:[],versions:[],systemStatus:null,apiInfo:null,performance:null,revision:'',loaded:false,cacheHydrated:false,fromCache:false,lastSyncAt:'',lastFullSyncAt:'',loadingPromise:null,lazyLoaded:{htmlDocuments:false,activity:false,versions:false,systemStatus:false},lazyPromises:{}});
    this.rebuildIndexes();
  },
  async load({force=false}={}){
    if(this.loadingPromise)return this.loadingPromise;
    this.loadingPromise=(async()=>{
      const fullSyncAge=Date.now()-new Date(this.lastFullSyncAt||0).getTime();const action=!force&&this.revision&&fullSyncAge<1800000?'bootstrapIfChanged':'bootstrapFast';
      const payload=action==='bootstrapIfChanged'?{revision:this.revision}:{};
      const d=await API.call(action,payload);
      if(d?.not_modified){
        if(d.apiInfo)this.apiInfo=d.apiInfo;
        if(d.performance)this.performance=d.performance;
        this.lastSyncAt=new Date().toISOString();this.fromCache=false;
        return this
      }
      this.apply(d,false);
      this.persistCache().catch(()=>{});
      return d
    })().finally(()=>{this.loadingPromise=null});
    return this.loadingPromise
  },
  async loadLazy(kind,{force=false}={}){
    if(!kind)return null;
    if(this.lazyLoaded[kind]&&!force)return kind==='systemStatus'?this.systemStatus:this[kind];
    if(this.lazyPromises[kind])return this.lazyPromises[kind];
    this.lazyPromises[kind]=(async()=>{
      const out=await API.call('getLazyModule',{kind});
      if(kind==='systemStatus')this.systemStatus=out?.data||out?.systemStatus||null;
      else this[kind]=Array.isArray(out?.rows)?out.rows:[];
      this.lazyLoaded[kind]=true;
      // Modul berat sengaja tidak disimpan ulang ke cache login.
      return kind==='systemStatus'?this.systemStatus:this[kind];
    })().finally(()=>{delete this.lazyPromises[kind]});
    return this.lazyPromises[kind]
  },
  hasCapability(name){return API.isDemo()||!!(this.apiInfo?.capabilities||[]).includes(name)},
  staffNames(){
    const names=[];
    (this.accounts||[]).forEach(a=>names.push(...this.cleanPersonNames(a.nama)));
    (this.tasks||[]).forEach(t=>names.push(...this.cleanPersonNames(t.petugas)));
    (this.briefs||[]).forEach(b=>{
      names.push(...this.cleanPersonNames(b.petugas));
      const assignments=Array.isArray(b.jobdesk)?b.jobdesk:Utils.parseJSON(b.jobdesk,[]);
      if(Array.isArray(assignments))assignments.forEach(a=>names.push(...this.cleanPersonNames(a?.petugas)))
    });
    return [...new Set(names.map(n=>n.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id-ID'))
  },
  accountOptions(){
    const seen=new Set();
    return (this.accounts||[]).filter(a=>a&&a.id&&this.cleanPersonNames(a.nama).length).map(a=>{
      const nama=this.cleanPersonNames(a.nama)[0];return {id:String(a.id),nama,role:String(a.role||''),whatsapp:a.whatsapp||''}
    }).filter(a=>{if(seen.has(a.id))return false;seen.add(a.id);return true}).sort((a,b)=>a.nama.localeCompare(b.nama,'id-ID'))
  },
  accountById(id){return this._accountMap.get(String(id))||(this.accounts||[]).find(a=>String(a.id)===String(id))||null},
  accountByName(name){const target=this.cleanPersonNames(name)[0]?.toLowerCase()||'';return (this.accounts||[]).find(a=>(this.cleanPersonNames(a.nama)[0]?.toLowerCase()||'')===target)||null}
};

const FormDraft = (() => {
  const PREFIX='mwg_form_draft_v160_';
  const userKey=()=>Auth.session?.user?.id||Auth.session?.user?.username||'guest';
  const key=(entity,id)=>`${PREFIX}${userKey()}_${entity}_${id||'new'}`;
  function capture(form,extra){
    const counters={},fields=[];
    [...form.elements].forEach(el=>{if(!el.name||['button','submit','file'].includes(el.type))return;const i=counters[el.name]||0;counters[el.name]=i+1;fields.push({name:el.name,index:i,type:el.type,value:el.value,checked:!!el.checked})});
    return {saved_at:Date.now(),fields,extra:extra?extra():null};
  }
  function restore(form,data,before){
    if(before)before(data.extra||null);
    (data.fields||[]).forEach(item=>{const els=[...form.elements].filter(x=>x.name===item.name),el=els[item.index||0];if(!el)return;if(['checkbox','radio'].includes(item.type))el.checked=!!item.checked;else el.value=item.value??''});
    form.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function attach(form,{entity,recordId,captureExtra,restoreExtra}){
    const draftKey=key(entity,recordId),raw=localStorage.getItem(draftKey);let timer=null;
    const bar=document.createElement('div');bar.className='draft-bar';
    const saved=raw?Utils.parseJSON(raw,null):null;
    bar.innerHTML=saved?`<div><strong>Draft lokal ditemukan</strong><span>Disimpan ${Utils.formatDateTime(new Date(saved.saved_at).toISOString())}</span><div class="draft-save-note" data-draft-status>Autosave aktif</div></div><div class="actions"><button type="button" class="btn btn-sm btn-primary" data-draft-restore>Lanjutkan</button><button type="button" class="btn btn-sm" data-draft-discard>Buang</button></div>`:`<div><strong>Autosave aktif</strong><span>Isian disimpan sementara di perangkat.</span><div class="draft-save-note" data-draft-status>Belum ada perubahan</div></div>`;
    form.prepend(bar);
    const status=bar.querySelector('[data-draft-status]');
    const save=()=>{try{localStorage.setItem(draftKey,JSON.stringify(capture(form,captureExtra)));if(status)status.textContent='Draft tersimpan • '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){}};
    const schedule=()=>{clearTimeout(timer);timer=setTimeout(save,700)};
    form.addEventListener('input',schedule);form.addEventListener('change',schedule);
    bar.querySelector('[data-draft-restore]')?.addEventListener('click',()=>{restore(form,saved,restoreExtra);Utils.toast('Draft lokal dipulihkan','success');bar.querySelector('.actions')?.remove()});
    bar.querySelector('[data-draft-discard]')?.addEventListener('click',()=>{localStorage.removeItem(draftKey);bar.remove();Utils.toast('Draft lokal dibuang')});
    return {clear(){clearTimeout(timer);localStorage.removeItem(draftKey)},save,draftKey};
  }
  return {attach};
})();

const EditConflict = (() => {
  function isConflict(error){return /^EDIT_CONFLICT\|/.test(String(error?.message||''))}
  function handle(error,route){
    if(!isConflict(error))return false;
    const parts=String(error.message).split('|'),msg=parts[1]||'Data telah diubah pengguna lain.';
    Utils.toast(msg+' Muat ulang sebelum menyimpan.','error');
    if(confirm(msg+'\n\nMuat ulang data terbaru sekarang?')){Utils.closeModal();App.reload(route,true)}
    return true;
  }
  return {isConflict,handle};
})();

const OfflineQueue = (() => {
  const KEY='mwg_offline_queue_v160',allowed=new Set(['saveBrief','saveTask','saveFootage','saveHotIssue','saveMeeting']);let busy=false;
  const userKey=()=>Auth.session?.user?.id||Auth.session?.user?.username||'guest';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY+'_'+userKey())||'[]')}catch{return []}};
  const save=rows=>{localStorage.setItem(KEY+'_'+userKey(),JSON.stringify(rows));render()};
  const canQueue=action=>allowed.has(action);
  function ensureId(action,payload){const p=JSON.parse(JSON.stringify(payload||{}));const pre=action==='saveBrief'?'BRF':action==='saveTask'?'TSK':action==='saveHotIssue'?'HOT':action==='saveMeeting'?'RPT':'FTG';if(!p._request_id)p._request_id=p.record?._request_id||Utils.id('REQ');if(p.record){if(!p.record.id)p.record.id=Utils.id(pre);if(!p.record._request_id)p.record._request_id=p._request_id}return p}
  async function enqueue(action,payload,error){
    const rows=load(),normalized=ensureId(action,payload),requestId=normalized._request_id||normalized.record?._request_id||Utils.id('REQ'),recordId=normalized.record?.id||'';
    const existing=rows.findIndex(x=>x.request_id===requestId||(recordId&&x.action===action&&String(x.payload?.record?.id||'')===String(recordId)));
    const item={request_id:requestId,action,payload:normalized,created_at:existing>=0?(rows[existing].created_at||Utils.isoNow()):Utils.isoNow(),attempts:existing>=0?(rows[existing].attempts||0):0,last_error:String(error?.message||'Offline')};
    if(existing>=0)rows[existing]=item;else rows.push(item);save(rows);
    Utils.toast('Tidak ada koneksi. Perubahan masuk antrean sinkronisasi.','success');
    return {_queued:true,request_id:requestId,record:normalized.record||null};
  }
  async function process(){
    if(busy||!navigator.onLine||!Auth.session)return;let rows=load();if(!rows.length){render();return}
    busy=true;render('syncing');
    try{
      while(rows.length){
        const item=rows[0];item.attempts=(item.attempts||0)+1;
        try{await API.call(item.action,item.payload,{skipQueue:true});rows.shift();save(rows)}
        catch(e){item.last_error=e.message;save(rows);if(EditConflict.isConflict(e))Utils.toast('Antrean berhenti karena konflik edit. Buka data terbaru lalu periksa perubahan.','error');break}
      }
      if(!rows.length){Utils.toast('Semua antrean offline berhasil disinkronkan','success');try{await Store.load({force:true});const route=location.hash.slice(1);if(route&&route!=='public')App.navigate(route,false)}catch{}}
    }finally{busy=false;render()}
  }
  function render(state=''){
    let el=document.querySelector('#syncIndicator');if(!el){el=document.createElement('div');el.id='syncIndicator';document.body.appendChild(el)}
    const count=load().length,online=navigator.onLine;
    el.className=`sync-indicator ${online?'':'offline'} ${state==='error'?'error':''}`;
    el.innerHTML=`<span class="sync-dot"></span><span>${online?(state==='syncing'?'Menyinkronkan...':count?`${count} menunggu sinkronisasi`:'Online'):`Offline • ${count} antrean`}</span>${count&&online?'<button type="button" data-sync-now>Sinkronkan</button>':''}${count?'<button type="button" data-queue-manage>Kelola</button>':''}`;
    el.querySelector('[data-sync-now]')?.addEventListener('click',process);el.querySelector('[data-queue-manage]')?.addEventListener('click',openManager);
    el.classList.toggle('hidden',!Auth.session&&!count);
  }
  function openManager(){
    const rows=load();Utils.modal('Antrean Sinkronisasi',`<div class="queue-warning">Data pada antrean belum tersimpan di Spreadsheet. Konflik edit harus diperiksa sebelum mencoba ulang.</div>${rows.map((x,i)=>`<div class="backup-row"><div><strong>${Utils.esc(x.action)}</strong><div class="cell-sub">${Utils.formatDateTime(x.created_at)} • Percobaan ${x.attempts||0}${x.last_error?`<br>${Utils.esc(x.last_error)}`:''}</div></div><button class="btn btn-sm btn-danger" data-queue-discard="${i}">Buang</button></div>`).join('')||'<p class="cell-sub">Antrean kosong.</p>'}`,`<button class="btn" data-close-modal>Tutup</button>${rows.length&&navigator.onLine?'<button class="btn btn-primary" id="queueRetryAll">Coba Sinkronkan</button>':''}`,'small');
    Utils.qa('[data-queue-discard]').forEach(btn=>btn.onclick=()=>{const list=load();list.splice(Number(btn.dataset.queueDiscard),1);save(list);Utils.closeModal();openManager()});
    const retry=Utils.q('#queueRetryAll');if(retry)retry.onclick=()=>{Utils.closeModal();process()};
  }
  function init(){window.addEventListener('online',()=>{render();process()});window.addEventListener('offline',render);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')process()});render();setTimeout(process,900)}
  return {canQueue,enqueue,process,init,count:()=>load().length,render};
})();

const ErrorReporter = (() => {
  let sending=false,initialized=false,lastSentAt=0;
  async function send(source,error,context={}){
    if(sending||!Auth.session||!navigator.onLine||API.isDemo()||Date.now()-lastSentAt<60000)return;
    sending=true;lastSentAt=Date.now();try{await API.call('logClientError',{source,action:context.action||'',page:location.hash.slice(1),message:String(error?.message||error||'Unknown error'),stack:String(error?.stack||''),context},{skipQueue:true})}catch{}finally{sending=false}
  }
  function init(){if(initialized)return;initialized=true;window.addEventListener('error',e=>send('window.error',e.error||e.message,{file:e.filename,line:e.lineno,column:e.colno}));window.addEventListener('unhandledrejection',e=>send('unhandledrejection',e.reason||'Promise rejected'))}
  return {send,init};
})();

  function countBy(arr,key){return arr.reduce((o,x)=>{const k=typeof key==='function'?key(x):x[key]||'Tidak ada';o[k]=(o[k]||0)+1;return o},{})}
  function monthKey(v){const key=Utils.toDateKey(v);return key?key.slice(0,7):''}

  const samePerson=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
  const personalDashboard=()=>!Auth.can(Config.roles.SUPERADMIN);
  function baseTasks(){const rows=!personalDashboard()?(Store.tasks||[]):Array.isArray(Store.myTasks)?Store.myTasks:(Store.tasks||[]).filter(t=>(t.petugas_id&&String(t.petugas_id)===String(Auth.session?.user?.id))||(!t.petugas_id&&samePerson(t.petugas,Auth.session?.user?.nama)));return rows.filter(t=>!t.archived)}

  function availableMonths(){const briefs=baseBriefs(),tasks=baseTasks();return [...new Set([...briefs.map(b=>monthKey(b.tanggal)),...tasks.filter(t=>!t.brief_id).map(t=>monthKey(t.deadline))].filter(Boolean))].sort().reverse()}
  function scopedBriefs(){const rows=baseBriefs();return selectedMonth?rows.filter(b=>monthKey(b.tanggal)===selectedMonth):rows}

  function normalizeWa(value){let n=String(value||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);if(!n.startsWith('62'))n='62'+n;return n}
  async function sendWhatsApp(briefId,person){
    const b=Store.briefById(briefId);
    if(!b){Utils.toast('Brief tidak ditemukan.','error');return}
    const acc=(Store.accounts||[]).find(a=>String(a.nama||'').trim().toLowerCase()===String(person||'').trim().toLowerCase());
    const phone=normalizeWa(acc?.whatsapp||acc?.no_wa);
    if(!phone){Utils.toast('Nomor WhatsApp petugas belum diisi pada menu Akun.','error');return}

    const personal=`Halo *${person}*, berikut brief dan tugas Anda.

${waText(b)}

Mohon konfirmasi setelah brief diterima.`;
    const waUrl=`https://wa.me/${phone}?text=${encodeURIComponent(personal)}`;
    const opened=window.open(waUrl,'_blank');
    if(!opened){Utils.toast('WhatsApp diblokir browser. Izinkan pop-up lalu coba lagi.','error');return}

    const previous=waStatusMap(b);
    const optimistic={...previous,[person]:{syncing:true,sent_at:Utils.isoNow(),sent_by:Auth.session.user.nama,phone}};
    b.wa_sent_status=optimistic;
    refreshTable();
    view(briefId);

    try{
      let result;
      try{
        result=await API.call('markBriefWhatsAppSent',{brief_id:b.id,person,phone});
      }catch(primaryError){
        const msg=String(primaryError?.message||primaryError||'');
        if(!/Action tidak dikenal|tidak dikenal|unknown action/i.test(msg))throw primaryError;
        const fallbackMap={...previous,[person]:{status:'sent',sent_at:Utils.isoNow(),sent_by:Auth.session.user.nama,phone}};
        const record=await API.call('updateBriefField',{id:b.id,field:'wa_sent_status',value:fallbackMap});
        result={wa_sent_status:record?.wa_sent_status||fallbackMap,entry:(record?.wa_sent_status||fallbackMap)[person]};
      }

      const savedMap=Utils.parseJSON(result?.wa_sent_status,{});
      const savedEntry=waStatusEntry(savedMap,person)||result?.entry;
      if(!savedEntry?.sent_at)throw new Error('Status WhatsApp tidak dikembalikan oleh server. Perbarui dan deploy GS v1.3.2.');
      b.wa_sent_status=savedMap;
      refreshTable();
      await Store.load();
      const fresh=Store.briefs.find(x=>String(x.id)===String(briefId));
      if(fresh){
        const verified=waStatusEntry(waStatusMap(fresh),person);
        if(!verified?.sent_at)throw new Error('Status belum terbaca kembali dari Spreadsheet. Jalankan migrateToV132() lalu deploy ulang GS.');
      }
      refreshTable();
      view(briefId);
      Utils.toast(`✓ Status WA ${person} sudah tersimpan`,'success');
    }catch(e){
      b.wa_sent_status=previous;
      refreshTable();
      view(briefId);
      Utils.toast(`WhatsApp sudah dibuka, tetapi status gagal disimpan: ${e.message}`,'error');
    }
  }

  function refreshTable(){const box=Utils.q('#taskTable');if(!box)return;const all=sortRows(filtered()),rows=pageSlice(all);box.innerHTML=table(rows);const summary=Utils.q('#taskSummary');if(summary)summary.innerHTML=taskSummaryHtml(all);const pager=Utils.q('#taskPager');if(pager)pager.innerHTML=pagerHtml(all.length);const count=Utils.q('#taskResultCount');if(count)count.innerHTML=resultText(all.length);bindSort();bindPager()}
  function bindPager(){Utils.qa('[data-task-page]').forEach(btn=>btn.onclick=()=>{pageIndex=Number(btn.dataset.taskPage)||1;refreshTable()})}
  function bindSort(){Utils.qa('[data-task-sort]').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.taskSort;if(sortKey===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=key;sortDir='asc'}pageIndex=1;refreshTable()})}
  function bindFilters(){['taskSearch','taskStatus','taskPriority','taskPic','taskArchive'].forEach(id=>{const el=Utils.q('#'+id);if(el)el.addEventListener(id==='taskSearch'?'input':'change',()=>{pageIndex=1;refreshTable()})});const order=Utils.q('#taskOrder');if(order)order.onchange=()=>{const [key,dir]=String(order.value||'created_at:desc').split(':');sortKey=key;sortDir=dir;pageIndex=1;refreshTable()};const size=Utils.q('#taskPageSize');if(size)size.onchange=()=>{pageSize=Number(size.value)||10;pageIndex=1;refreshTable()};const reset=Utils.q('#taskResetFilters');if(reset)reset.onclick=()=>{['taskSearch','taskStatus','taskPriority','taskPic'].forEach(id=>{const el=Utils.q('#'+id);if(el)el.value=''});const ar=Utils.q('#taskArchive');if(ar)ar.value='active';if(order)order.value='created_at:desc';if(size)size.value='10';pageIndex=1;pageSize=10;sortKey='created_at';sortDir='desc';refreshTable()};bindSort();bindPager()}
  return {page,openForm,view,waText,del,archive,exportExcel,bindFilters,visibleRows:visibleTasks};
})()

================================================================ */
const CalendarModule = (() => {
  let mode='brief',dateMode='tanggal',cursor=new Date();
  const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function page(publicOnly=false){
    mode=publicOnly?'public':(mode==='public'?'brief':mode);
    const modeButtons=publicOnly
      ? '<button class="active" type="button">Brief</button>'
      : `<button data-cal-mode="brief" class="${mode==='brief'?'active':''}">Brief</button><button data-cal-mode="task" class="${mode==='task'?'active':''}">Tugas</button>`;
    const dateButtons=`<button data-cal-date-mode="tanggal" class="${dateMode==='tanggal'?'active':''}">Tanggal Tayang</button><button data-cal-date-mode="deadline" class="${dateMode==='deadline'?'active':''}">Deadline</button>`;
    const legend=Config.pillars.filter(p=>!['Lainnya',"Sidak Gus'e"].includes(p)).map(p=>`<span class="legend-item"><span class="legend-dot" style="background:${Config.getPillarColor(p)}"></span>${Utils.esc(p)}</span>`).join('');
    return `<div class="calendar-shell"><div class="calendar-bar"><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><div class="segmented">${modeButtons}</div><div class="segmented" title="Pilih tanggal yang ditampilkan">${dateButtons}</div>${publicOnly?'<span class="badge badge-blue">Kalender Publik • Hanya Lihat</span>':''}</div><div class="month-title" id="monthTitle"></div><div class="actions"><button class="btn btn-icon" data-cal-nav="-1" aria-label="Bulan sebelumnya">‹</button><button class="btn" data-cal-today>Hari ini</button><button class="btn btn-icon" data-cal-nav="1" aria-label="Bulan berikutnya">›</button></div></div><div class="calendar-legend">${legend}<span class="legend-item"><span class="legend-dot" style="background:#94a3b8"></span>Draft tetap ditampilkan</span></div><div class="calendar-week">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div>${x}</div>`).join('')}</div><div id="calendarGrid" class="calendar-grid"></div></div>`
  }
  function render(){
    const title=Utils.q('#monthTitle'),grid=Utils.q('#calendarGrid');if(!title||!grid)return;
    const y=cursor.getFullYear(),m=cursor.getMonth();title.textContent=`${monthNames[m]} ${y}`;
    const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=Utils.dateKey(d),out=d.getMonth()!==m,today=ds===Utils.today();html+=`<div class="cal-day ${out?'out':''} ${today?'today':''}" data-date="${ds}"><div class="day-number">${d.getDate()}</div>${events(ds)}</div>`}
    grid.innerHTML=html;bindDnD()
  }
  function events(ds){
    let arr=[];
    if(mode==='brief'||mode==='public'){
      const field=dateMode==='deadline'?'deadline':'tanggal';
      arr=Store.briefs.filter(b=>!b.archived&&Utils.toDateKey(b[field])===ds&&String(b.approval_status||'').trim().toLowerCase()!=='batal').map(b=>{
        const publicView=mode==='public',pillar=Config.resolvePillar(b.konten_pilar),rawApproval=String(b.approval_status||'').trim(),approval=rawApproval||(['Publish','Insight'].includes(b.status)?'Publish':b.status==='Review'?'Review':'Draft'),isDraft=approval.toLowerCase()==='draft',icon=Config.approvalStatusIcons[approval]||'📝',dateLabel=dateMode==='deadline'?'Deadline':'Tayang';
        return {id:b.id,title:`${icon} ${isDraft?'[DRAFT] ':''}${b.judul}`.trim(),tooltip:`${b.judul} | ${dateLabel}: ${Utils.formatDate(b[field])} | ${pillar} | ${b.status||'-'} | Approval: ${approval}`,color:publicView?Config.getPillarColor(pillar):(isDraft?'#94a3b8':Config.getPillarColor(pillar)),textColor:publicView?Config.getPillarTextColor(pillar):(isDraft?'#ffffff':Config.getPillarTextColor(pillar)),type:'brief',draft:!publicView&&isDraft,draggable:!publicView&&Auth.can(Config.roles.SUPERADMIN)}
      })
    } else {
      arr=Store.tasks.filter(t=>!t.archived&&Utils.sameDate(t.deadline,ds)).map(t=>{const icon=Config.taskStatusIcons[t.status]||'';return{id:t.id,title:`${icon} ${t.petugas}: ${t.judul_tugas}`.trim(),tooltip:`${t.judul_tugas} | ${t.petugas} | ${t.status}`,color:'#831843',type:'task',draggable:Auth.can(Config.roles.SUPERADMIN)||(Auth.can(Config.roles.STAF)&&t.petugas===Auth.session.user.nama)}})
    }
    return arr.slice(0,5).map(e=>`<div class="cal-event ${e.type==='task'?'task':''} ${e.draft?'draft':''}" style="background:${e.color};color:${e.textColor||'#ffffff'}" draggable="${e.draggable}" data-id="${e.id}" data-type="${e.type}" title="${Utils.esc(e.tooltip||e.title)}">${Utils.esc(e.title)}</div>`).join('')+(arr.length>5?`<div class="cell-sub">+${arr.length-5} lainnya</div>`:'')
  }
  function bind(){
    Utils.qa('[data-cal-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.calMode;if(mode==='task')dateMode='deadline';Utils.qa('[data-cal-mode]').forEach(x=>x.classList.toggle('active',x===b));Utils.qa('[data-cal-date-mode]').forEach(x=>x.classList.toggle('active',x.dataset.calDateMode===dateMode));render()});
    Utils.qa('[data-cal-date-mode]').forEach(b=>b.onclick=()=>{dateMode=b.dataset.calDateMode;if(mode==='task')mode='brief';Utils.qa('[data-cal-mode]').forEach(x=>x.classList.toggle('active',x.dataset.calMode===mode));Utils.qa('[data-cal-date-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});
    Utils.qa('[data-cal-nav]').forEach(b=>b.onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+Number(b.dataset.calNav),1);render()});
    const todayBtn=Utils.q('[data-cal-today]');if(todayBtn)todayBtn.onclick=()=>{cursor=new Date();render()};render()
  }
  function bindDnD(){
    Utils.qa('.cal-event').forEach(e=>{e.onclick=()=>{if(e.dataset.type==='brief'){if(mode==='public')viewPublic(e.dataset.id);else BriefModule.view(e.dataset.id)}else{const task=Store.tasks.find(t=>t.id===e.dataset.id);if(task)TaskModule.view(task.id)}};e.ondragstart=ev=>{if(e.getAttribute('draggable')!=='true')return;ev.dataTransfer.setData('application/json',JSON.stringify({id:e.dataset.id,type:e.dataset.type}))}});
    Utils.qa('.cal-day').forEach(d=>{d.ondragover=e=>{if(mode==='public')return;e.preventDefault();d.classList.add('drop-zone','drag-over')};d.ondragleave=()=>d.classList.remove('drag-over');d.ondrop=async e=>{if(mode==='public')return;e.preventDefault();d.classList.remove('drag-over');let item;try{item=JSON.parse(e.dataTransfer.getData('application/json'))}catch{return}const date=d.dataset.date;try{if(item.type==='brief'){const field=dateMode==='deadline'?'deadline':'tanggal';await API.call('updateBriefField',{id:item.id,field,value:date});Utils.toast(field==='deadline'?'Deadline brief diperbarui':'Tanggal tayang diperbarui','success')}else{await API.call('updateTaskField',{id:item.id,field:'deadline',value:date});Utils.toast('Deadline tugas diperbarui','success')}await Store.load();render()}catch(err){Utils.toast(err.message,'error')}}})
  }
  function viewPublic(id){const b=Store.briefs.find(x=>x.id===id);if(!b)return;const approval=String(b.approval_status||'Draft');Utils.modal('Jadwal Konten',`<div class="profile-hero"><div class="avatar">${Utils.initials(b.judul)}</div><div><h2 style="margin:0;font-size:20px">${Utils.esc(b.judul)}</h2><p class="cell-sub">Tayang ${Utils.formatDate(b.tanggal)} • Deadline ${Utils.formatDate(b.deadline)}</p></div></div><table style="margin-top:20px;min-width:0"><tr><td>Konten Pilar</td><td>${Utils.esc(Config.resolvePillar(b.konten_pilar)||'-')}</td></tr><tr><td>Status Produksi</td><td>${Utils.statusBadge(b.status||'-')}</td></tr><tr><td>Status Approval</td><td>${Utils.statusBadge(approval)}</td></tr></table>`,`<button class="btn" data-close-modal>Tutup</button>`,'small')}
  return {page,bind};
})();

const Report = (() => {
  let selected=Utils.today();
  function summary(date=selected){const day=Utils.toDateKey(date)||Utils.today();const onPublish=b=>Utils.sameDate(b.tanggal,day),onWork=b=>Utils.sameDate(b.tanggal,day)||Utils.sameDate(b.deadline,day);const briefs=(Store.briefs||[]).filter(b=>!b.archived),allTasks=(Store.tasks||[]).filter(t=>!t.archived);const pub=briefs.filter(b=>onPublish(b)&&['Publish','Insight'].includes(b.status));const prod=briefs.filter(b=>onWork(b)&&!['Publish','Insight'].includes(b.status));const insight=briefs.filter(b=>(onPublish(b)||Utils.sameDate(b.updated_at,day))&&Number(b.insight_reach)>0);const tasks=allTasks.filter(t=>Utils.sameDate(t.deadline,day));return {day,pub,prod,insight,tasks}}
  function wa(date=selected){const s=summary(date);return `📊 *REPORT PRODUKSI KONTEN*\n\nTanggal: ${Utils.formatDate(s.day)}\n\n✅ *Publish:*\n${s.pub.map(x=>`- ${x.judul}${x.link_konten?`\n  ${x.link_konten}`:''}`).join('\n')||'-'}\n\n⚙️ *Produksi:*\n${s.prod.map(x=>`- ${x.judul} (${x.status})`).join('\n')||'-'}\n\n🧑‍💻 *Tugas Hari Ini:*\n${s.tasks.map(x=>`- ${x.petugas}: ${x.judul_tugas} (${x.status})`).join('\n')||'-'}\n\n📈 *Insight:*\n${s.insight.map(x=>`- ${x.judul}: ${Utils.num(x.insight_reach)} reach`).join('\n')||'-'}`}
  function page(){selected=Utils.toDateKey(selected)||Utils.today();const s=summary();return `<div class="section-row"><div class="section-title"><h3>Report Harian</h3><p>Ringkasan brief, publikasi, tugas, dan insight berdasarkan tanggal terpilih.</p></div><div class="actions"><button class="btn btn-soft" data-action="copy-report">💬 Copy WhatsApp</button><button class="btn" data-action="pdf-report">PDF</button><button class="btn" data-action="export-report">Excel</button></div></div><div class="card card-pad"><div class="toolbar"><label style="font-size:12px;font-weight:800">Tanggal</label><input id="reportDate" class="input" type="date" value="${selected}"><span class="badge badge-blue">${s.pub.length+s.prod.length} brief • ${s.tasks.length} tugas</span></div><div id="reportBody">${body(s)}</div></div>`}
  function body(s){return `<div class="grid grid-4"><div class="card card-pad"><h4 style="margin-top:0">✅ Publish (${s.pub.length})</h4>${s.pub.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${x.link_konten?`<a href="${Utils.esc(x.link_konten)}" target="_blank">${Utils.esc(x.link_konten)}</a>`:'Link belum diisi'}</div></div>`).join('')||'<p class="cell-sub">Belum ada publish.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">⚙️ Produksi (${s.prod.length})</h4>${s.prod.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${Utils.statusBadge(x.status)}</div></div>`).join('')||'<p class="cell-sub">Belum ada proses.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">🧑‍💻 Tugas (${s.tasks.length})</h4>${s.tasks.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.petugas)}</strong><div class="cell-sub">${Utils.esc(x.judul_tugas)} • ${Utils.statusBadge(x.status)}</div></div>`).join('')||'<p class="cell-sub">Belum ada tugas.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">📈 Insight (${s.insight.length})</h4>${s.insight.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${Utils.num(x.insight_reach)} reach</div></div>`).join('')||'<p class="cell-sub">Belum ada insight.</p>'}</div></div><div class="code-note" style="margin-top:18px">${Utils.esc(wa(s.day))}</div>`}
  function bind(){const input=Utils.q('#reportDate');if(input)input.onchange=e=>{selected=Utils.toDateKey(e.target.value)||Utils.today();const s=summary(selected);const bodyEl=Utils.q('#reportBody');if(bodyEl)bodyEl.innerHTML=body(s)}}
  function print(){const s=summary();Utils.printDocument('Report Harian '+s.day,`<h1 class="title">REPORT PRODUKSI KONTEN</h1><div class="date">${Utils.formatDate(s.day)}</div><div class="section"><h3>Konten Publish</h3><table><tr><th>Judul</th><th>Link</th></tr>${s.pub.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.esc(x.link_konten||'-')}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div><div class="section"><h3>Konten Produksi</h3><table><tr><th>Judul</th><th>Status</th></tr>${s.prod.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div><div class="section"><h3>Tugas Hari Ini</h3><table><tr><th>PIC</th><th>Tugas</th><th>Status</th></tr>${s.tasks.map(x=>`<tr><td>${Utils.esc(x.petugas)}</td><td>${Utils.esc(x.judul_tugas)}</td><td>${Utils.esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="3">-</td></tr>'}</table></div><div class="section"><h3>Insight</h3><table><tr><th>Judul</th><th>Reach</th></tr>${s.insight.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.num(x.insight_reach)}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div>`)}
  function exportExcel(){const s=summary();Utils.exportXls(`report_${s.day}.xls`,{PUBLISH:[['Judul','Link'],...s.pub.map(x=>[x.judul,x.link_konten||''])],PRODUKSI:[['Judul','Status'],...s.prod.map(x=>[x.judul,x.status])],TUGAS:[['PIC','Tugas','Status','Deadline'],...s.tasks.map(x=>[x.petugas,x.judul_tugas,x.status,Utils.toDateKey(x.deadline)])],INSIGHT:[['Judul','Reach'],...s.insight.map(x=>[x.judul,Number(x.insight_reach)||0])]})}
  return {page,bind,wa,print,exportExcel};
})();

/* ================================================================
   PWA / INSTALL MODULE
================================================================ */
const PWA = (() => {
  let deferredPrompt=null,installBanner=null,controllerReloaded=false;
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid=()=>/android/i.test(navigator.userAgent);
  const secureContext=()=>location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
  const canRegister=()=>secureContext()&&'serviceWorker' in navigator;
  function status(){
    if(isStandalone())return {key:'ready',label:'Sudah terinstal',detail:'Aplikasi sedang berjalan dalam mode standalone.'};
    if(deferredPrompt)return {key:'available',label:'Siap diinstal',detail:'Browser mendukung instalasi langsung.'};
    if(location.protocol==='file:')return {key:'limited',label:'Perlu hosting HTTPS',detail:'File lokal dapat dibuka, tetapi instalasi PWA memerlukan URL HTTPS.'};
    if(!secureContext())return {key:'limited',label:'Koneksi belum aman',detail:'Gunakan HTTPS agar service worker dan instalasi aktif.'};
    if(isIOS())return {key:'available',label:'Tambahkan ke Layar Utama',detail:'Gunakan menu Bagikan pada Safari.'};
    return {key:'available',label:'Shortcut tersedia',detail:'Gunakan tombol instal atau menu browser.'};
  }
  function statusHtml(){const s=status();return `<span class="pwa-status ${s.key}">${s.key==='ready'?'✓':s.key==='limited'?'!':'📲'} ${Utils.esc(s.label)}</span><div class="cell-sub" style="margin-top:8px">${Utils.esc(s.detail)}</div>`}
  function createBanner(){
    if(installBanner||isStandalone())return;
    installBanner=document.createElement('div');installBanner.id='pwaInstallBanner';installBanner.className='pwa-install-banner hidden';
    installBanner.innerHTML=`<div class="pwa-install-banner-icon">📲</div><div class="pwa-install-banner-copy"><strong>Instal MEDIA WADUL GUS'E di HP</strong><span>Buka seperti aplikasi dan tambahkan ikon ke layar utama.</span></div><div class="pwa-install-banner-actions"><button class="btn btn-primary btn-sm" type="button" data-pwa-install>Instal</button><button class="btn btn-sm" type="button" data-pwa-dismiss>Nanti</button></div>`;
    document.body.appendChild(installBanner);
  }
  function showBanner(){createBanner();if(installBanner&&!sessionStorage.getItem('pwa_banner_dismissed'))installBanner.classList.remove('hidden')}
  function hideBanner(){installBanner?.classList.add('hidden')}
  function steps(){
    if(location.protocol==='file:')return `<div class="pwa-note"><strong>File sedang dibuka dari penyimpanan lokal.</strong><br>PWA tidak dapat dipasang langsung dari alamat <code>file://</code>. Unggah seluruh isi paket ini ke hosting HTTPS, lalu buka URL tersebut melalui HP.</div><div class="pwa-guide-step"><b>1</b><div><strong>Unggah paket PWA</strong><p>Upload index.html, manifest.webmanifest, sw.js, dan folder icons tanpa mengubah strukturnya.</p></div></div><div class="pwa-guide-step"><b>2</b><div><strong>Buka URL HTTPS</strong><p>Gunakan Chrome Android atau Safari iPhone untuk membuka alamat aplikasi.</p></div></div><div class="pwa-guide-step"><b>3</b><div><strong>Tekan Instal Aplikasi</strong><p>Tombol instal akan aktif setelah browser membaca manifest dan service worker.</p></div></div>`;
    if(isIOS())return `<div class="pwa-guide-step"><b>1</b><div><strong>Buka melalui Safari</strong><p>Pastikan aplikasi tidak dibuka dari browser di dalam WhatsApp atau Instagram.</p></div></div><div class="pwa-guide-step"><b>2</b><div><strong>Tekan tombol Bagikan</strong><p>Pilih ikon kotak dengan panah ke atas pada toolbar Safari.</p></div></div><div class="pwa-guide-step"><b>3</b><div><strong>Pilih Tambahkan ke Layar Utama</strong><p>Konfirmasi nama aplikasi, kemudian tekan Tambah.</p></div></div>`;
    if(isAndroid())return `<div class="pwa-guide-step"><b>1</b><div><strong>Buka melalui Google Chrome</strong><p>Gunakan URL HTTPS aplikasi.</p></div></div><div class="pwa-guide-step"><b>2</b><div><strong>Tekan Instal Aplikasi</strong><p>Gunakan tombol pada CMS. Jika tidak muncul, buka menu ⋮ Chrome.</p></div></div><div class="pwa-guide-step"><b>3</b><div><strong>Pilih Instal aplikasi</strong><p>Pada sebagian perangkat tertulis “Tambahkan ke layar utama”.</p></div></div>`;
    return `<div class="pwa-guide-step"><b>1</b><div><strong>Buka menu browser</strong><p>Cari pilihan Instal aplikasi atau Tambahkan ke layar utama.</p></div></div><div class="pwa-guide-step"><b>2</b><div><strong>Konfirmasi instalasi</strong><p>Ikon MEDIA WADUL GUS'E akan ditambahkan sebagai aplikasi.</p></div></div>`;
  }
  function showGuide(){
    const s=status();Utils.modal("Instal MEDIA WADUL GUS'E",`<div style="margin-bottom:16px">${statusHtml()}</div><div class="pwa-guide">${steps()}</div><div class="login-note" style="margin-top:15px"><strong>Catatan:</strong> halaman dan aset aplikasi dapat tersimpan untuk dibuka kembali. Sinkronisasi serta perubahan data Google Spreadsheet tetap membutuhkan koneksi internet.</div>`,`<button class="btn" data-close-modal>Tutup</button>`,'small');
  }
  async function install(){
    hideBanner();
    if(isStandalone()){Utils.toast('Aplikasi sudah terinstal','success');return}
    if(!deferredPrompt){showGuide();return}
    try{deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;if(choice.outcome==='accepted')Utils.toast('Instalasi aplikasi dimulai','success');else Utils.toast('Instalasi dibatalkan');deferredPrompt=null}catch(err){Utils.toast('Prompt instalasi tidak tersedia. Gunakan menu browser.','error');showGuide()}
  }
  async function register(){
    if(!canRegister())return;
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)Utils.toast('Pembaruan aplikasi siap. Muat ulang untuk memakai versi terbaru.','success')})});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controllerReloaded)return;controllerReloaded=true;location.reload()});
    }catch(err){console.warn('Service worker gagal didaftarkan:',err)}
  }
  function init(){
    createBanner();register();
    setTimeout(()=>{if(deferredPrompt)showBanner()},1200);
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showBanner()});
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;hideBanner();Utils.toast("MEDIA WADUL GUS'E berhasil diinstal",'success')});
  document.addEventListener('click',e=>{if(e.target.closest('[data-pwa-install]')){e.preventDefault();install()}if(e.target.closest('[data-pwa-dismiss]')){sessionStorage.setItem('pwa_banner_dismissed','1');hideBanner()}});
  return {init,install,showGuide,status,statusHtml,isStandalone};

const InsightExtension = (() => {
  const pending=new Map();let extensionAvailable=false,lastVersion='';

/* ================================================================
   THEME MODULE — LIGHT / DARK / SYSTEM
================================================================ */
const Theme = (() => {
  const KEY='mwg_theme_mode',MODES=['system','light','dark'];
  const media=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  const mode=()=>localStorage.getItem(KEY)||'system';
  const resolved=m=>m==='dark'||(m==='system'&&media?.matches)?'dark':'light';
  function apply(next=mode(),persist=true){if(!MODES.includes(next))next='system';if(persist)localStorage.setItem(KEY,next);document.documentElement.dataset.theme=resolved(next);document.documentElement.dataset.themeMode=next;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=resolved(next)==='dark'?'#0f1117':'#4a1028';syncButtons();return next}
  function icon(){const m=mode();return m==='dark'?'☾':m==='light'?'☀':'◐'}
  function label(){return {system:'Ikuti Perangkat',light:'Terang',dark:'Gelap'}[mode()]||'Tema'}
  function cycle(){const m=mode(),next=m==='system'?'light':m==='light'?'dark':'system';apply(next);Utils.toast('Tema: '+label(),'success')}
  function syncButtons(){document.querySelectorAll('[data-theme-icon]').forEach(x=>x.textContent=icon());document.querySelectorAll('[data-theme-mode]').forEach(x=>x.classList.toggle('active',x.dataset.themeMode===mode()))}
  function settingsHtml(){return `<div class="card card-pad"><div class="section-title"><h3>Mode Tema</h3><p>Preferensi disimpan pada perangkat ini dan tidak menambah beban server.</p></div><div class="theme-picker"><button type="button" class="theme-option" data-theme-mode="system"><span>◐</span>Ikuti Perangkat</button><button type="button" class="theme-option" data-theme-mode="light"><span>☀</span>Terang</button><button type="button" class="theme-option" data-theme-mode="dark"><span>☾</span>Gelap</button></div><div class="theme-note">Tema aktif: <strong>${label()}</strong></div></div>`}
  function bindSettings(){document.querySelectorAll('[data-theme-mode]').forEach(btn=>btn.onclick=()=>apply(btn.dataset.themeMode));syncButtons()}
  if(media){const change=()=>{if(mode()==='system')apply('system',false)};media.addEventListener?media.addEventListener('change',change):media.addListener?.(change)}
  apply(mode(),false);
  return {apply,cycle,icon,label,settingsHtml,bindSettings,syncButtons};
})();

  function globalSearch(term){const box=Utils.q('#searchResults');term=term.trim().toLowerCase();if(term.length<2){box.classList.add('hidden');return}const items=[...Store.briefs.filter(x=>!x.archived).map(x=>({type:'Brief',title:x.judul,sub:x.detail_brief,route:'briefs',id:x.id})),...(TaskModule.visibleRows?TaskModule.visibleRows():Store.tasks).filter(x=>!x.archived).map(x=>({type:'Tugas',title:x.jobdesk||x.judul_tugas,sub:x.petugas,route:'tasks',id:x.id})),...Store.hotIssues.map(x=>({type:'Hot Issue',title:x.judul,sub:x.sumber,route:'hotissues',id:x.id})),...Store.meetings.map(x=>({type:'Rapat',title:x.judul_rapat,sub:x.agenda,route:'meetings',id:x.id})),...(Store.htmlDocuments||[]).map(x=>({type:'Dokumen HTML',title:x.judul,sub:x.nama_file,route:'htmlfiles',id:x.id})),...(Store.footages||[]).map(x=>({type:'Footage',title:x.judul,sub:x.keterangan||x.link_gdrive,route:'footages',id:x.id}))].filter(x=>[x.title,x.sub,x.type].join(' ').toLowerCase().includes(term)).slice(0,12);box.innerHTML=items.map(x=>`<div class="search-result" data-search-route="${x.route}" data-search-id="${x.id}"><strong>${Utils.esc(x.title)}</strong><span>${x.type} • ${Utils.esc((x.sub||'').slice(0,80))}</span></div>`).join('')||'<div class="empty" style="padding:20px">Tidak ditemukan</div>';box.classList.remove('hidden');Utils.qa('[data-search-route]',box).forEach(r=>r.onclick=()=>{navigate(r.dataset.searchRoute);box.classList.add('hidden');if(r.dataset.searchRoute==='briefs')BriefModule.view(r.dataset.searchId);if(r.dataset.searchRoute==='tasks')TaskModule.view(r.dataset.searchId);if(r.dataset.searchRoute==='meetings')Meeting.view(r.dataset.searchId)})}

  function contextAdd(){if(current==='briefs'&&Auth.can(Config.roles.SUPERADMIN))BriefModule.openForm();else if(current==='tasks'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.STAF,Config.roles.ANALIS))TaskModule.openForm();else if(current==='hotissues'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.ANALIS))HotIssue.openForm();else if(current==='meetings'&&Auth.can(Config.roles.SUPERADMIN))Meeting.openForm();else if(current==='htmlfiles'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.ANALIS))HtmlDocumentModule.openForm();else if(current==='footages'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.STAF,Config.roles.ANALIS))FootageModule.openForm();else Utils.toast('Tidak ada aksi tambah pada halaman ini')}
  async function publicCalendar(){document.body.classList.add('public-mode');Utils.q('#app').innerHTML=`<main class="public-calendar-page"><header class="topbar public-topbar"><div class="public-brand"><div class="brand-mark"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div><div><strong>${Utils.esc(Config.data.appName)}</strong><span>${Utils.esc(Config.data.organization)}</span></div></div><div class="page-heading"><h2>Kalender</h2><p>Jadwal brief dan tugas</p></div><div class="top-actions"><button class="icon-btn" type="button" data-action="theme-cycle" title="Ganti tema"><span data-theme-icon>${Theme.icon()}</span></button><button class="btn btn-soft browser-only" type="button" data-pwa-install>📲 Instal App</button><span class="badge badge-blue">Publik • v${APP_VERSION}</span><a class="btn btn-primary" href="${location.href.split('#')[0]}">Login CMS</a></div></header><section class="content"><div id="publicCalendarWrap"><div class="card card-pad"><div class="skeleton" style="height:400px"></div></div></div></section></main>`;const publicTheme=Utils.q('[data-action="theme-cycle"]');if(publicTheme)publicTheme.onclick=Theme.cycle;try{const data=await API.call('publicCalendar');Store.briefs=data;Store.tasks=[];Utils.q('#publicCalendarWrap').innerHTML=CalendarModule.page(true);CalendarModule.bind()}catch(e){Utils.q('#publicCalendarWrap').innerHTML=`<div class="card empty"><div class="empty-icon">⚠️</div><strong>Kalender publik gagal dimuat</strong><p>${Utils.esc(e.message)}</p></div>`}}
  window.addEventListener('hashchange',()=>{if(location.hash==='#public')publicCalendar();else if(Auth.session){if(!Utils.q('.app-shell'))renderShell();const r=location.hash.slice(1);reload(routes[r]?r:'dashboard')}else renderLogin()});
  return {init,renderLogin,reload,navigate};
})();

document.addEventListener('DOMContentLoaded',()=>{PWA.init();OfflineQueue.init();App.init()});
</script>
